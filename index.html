<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuelMate PWA</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22c55e">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0a0f1c;
  color:#e5e7eb;
}

.container{max-width:900px;margin:auto;padding:16px;}

.card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  padding:16px;
  border-radius:16px;
  margin-bottom:12px;
}

input,select,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:10px;
  border-radius:10px;
  border:none;
}

button{
  background:#22c55e;
  font-weight:600;
  cursor:pointer;
}

button.red{background:#ef4444;}
button.blue{background:#3b82f6;}

table{width:100%;font-size:13px;border-collapse:collapse;}
td,th{border-bottom:1px solid #333;padding:8px;color:#aaa;}
th{color:#fff;}
</style>

</head>

<body>

<div class="container">

<h2>🚗 FuelMate PWA</h2>

<div class="card">

<label>วันที่</label>
<input id="date" type="date">

<label>น้ำมัน</label>
<select id="fuelType" onchange="setFuel()">
  <option value="52.5">เบนซิน</option>
  <option value="40.2">ดีเซล</option>
  <option value="35.45">E20</option>
</select>

<label>ราคา</label>
<input id="fuelPrice" type="number">

<label>ระยะทาง</label>
<input id="distance" type="number">

<button onclick="calc()">คำนวณ + บันทึก</button>

<button class="red" onclick="clearAll()">ล้างทั้งหมด</button>
<button class="blue" onclick="exportCSV()">Export CSV</button>

<div id="result"></div>

</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<div class="card">
<table>
<thead>
<tr><th>วันที่</th><th>รวม</th><th></th></tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("fuel")||"[]");
let chart;

function setFuel(){
  fuelPrice.value = fuelType.value;
}

function calc(){

  let date = document.getElementById("date").value || new Date().toISOString().slice(0,10);
  let fuel = +fuelPrice.value;
  let d = +distance.value;

  let total = (d/12)*fuel;

  data.push({date,total});

  localStorage.setItem("fuel",JSON.stringify(data));

  render();
}

function render(){

  document.getElementById("table").innerHTML =
  data.map((v,i)=>
  `<tr>
    <td>${v.date}</td>
    <td>${v.total.toFixed(2)}</td>
    <td><button onclick="del(${i})">ลบ</button></td>
  </tr>`).join("");

  draw();
}

function del(i){
  data.splice(i,1);
  localStorage.setItem("fuel",JSON.stringify(data));
  render();
}

function clearAll(){
  data=[];
  localStorage.removeItem("fuel");
  render();
}

function exportCSV(){
  let csv="date,total\n";
  data.forEach(v=>csv+=`${v.date},${v.total}\n`);

  let blob=new Blob([csv],{type:"text/csv"});
  let url=URL.createObjectURL(blob);

  let a=document.createElement("a");
  a.href=url;
  a.download="fuel.csv";
  a.click();
}

function draw(){

  let labels=data.map(v=>v.date);
  let values=data.map(v=>v.total);

  if(chart) chart.destroy();

  chart=new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{
      labels,
      datasets:[{
        label:"ค่าใช้จ่าย",
        data:values,
        backgroundColor:"#22c55e"
      }]
    }
  });
}

// PWA service worker
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}

render();

</script>

</body>
</html>
